name: XiaoZhangGui
options:
  bundleIdPrefix: com.xiaozhanggui
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  XiaoZhangGui:
    type: application
    platform: iOS
    sources:
      - path: XiaoZhangGui
      - path: SharedKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios
        MARKETING_VERSION: "3.2.0"
        CURRENT_PROJECT_VERSION: "29"
        CODE_SIGN_ENTITLEMENTS: XiaoZhangGui/XiaoZhangGui.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 你的小掌柜
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 语音记一笔时需要使用麦克风进行识别
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将你的语音转换为经营记录
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于显示本地天气，仅在前台使用，不会上传位置
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # P0-1：天气 API Key 注入链
        # GitHub Secret XZG_WEATHER_API_KEY → CI xcodebuild 传入同名 build setting →
        # 生成的 Info.plist XZGWeatherAPIKey → WeatherConfiguration.current()
        # 本地未设置该变量时展开为空串，行为同未配置（绝不把 Key 写进仓库）。
        INFOPLIST_KEY_XZGWeatherAPIKey: $(XZG_WEATHER_API_KEY)
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.xiaozhanggui.ios
            CFBundleURLSchemes:
              - xzg
    dependencies:
      - target: XiaoZhangGuiWidget
        embed: true
        codeSign: true
        removeHeaders: true
        copy:
          destination: plugins
  XiaoZhangGuiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: XiaoZhangGuiWidget
      - path: SharedKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios.widget
        MARKETING_VERSION: "3.2.0"
        CURRENT_PROJECT_VERSION: "29"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: XiaoZhangGuiWidget/XiaoZhangGuiWidgetExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XiaoZhangGuiWidget/Info.plist
  XiaoZhangGuiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/*.ps1"
          - "**/*.json"
          - "**/*.md"
    dependencies:
      - target: XiaoZhangGui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XiaoZhangGui.app/XiaoZhangGui"
        BUNDLE_LOADER: "$(TEST_HOST)"
