name: XiaoZhangGui
options:
  bundleIdPrefix: com.xiaozhanggui
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
# V3.3 F0：LLMProviderKit（MIT、零依赖、iOS16+），精确锁版；
# 仅链接 core 与 OpenAI（OpenAI 兼容端点可自定义 baseURL），Gemini 留待 Lite FINAL。
# 业务层禁止直接 import，统一经 XZGAIProviderAdapter 隔离。
packages:
  LLMProviderKit:
    url: https://github.com/ayman3000/LLMProviderKit
    exactVersion: 0.1.0-alpha.31
  # V3.7.1 视觉：ThinkingOrbsKit（MIT © Jakub Antalik，iOS15+，零依赖，
  # 纯 SwiftUI Canvas + TimelineView），仅用于 AI 思考态指示；精确锁版。
  # 只在 TypingIndicator 内 import，业务层与 AI 执行链不依赖它。
  ThinkingOrbsKit:
    url: https://github.com/FujiwaraChoki/ThinkingOrbsKit
    exactVersion: 0.3.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  XiaoZhangGui:
    type: application
    platform: iOS
    sources:
      - path: XiaoZhangGui
      - path: SharedKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "43"
        CODE_SIGN_ENTITLEMENTS: XiaoZhangGui/XiaoZhangGui.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 你的小掌柜
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 语音记一笔时需要使用麦克风进行识别
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将你的语音转换为经营记录
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于显示本地天气，仅在前台使用，不会上传位置
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # P0-1：天气 API Key 注入链
        # GitHub Secret XZG_WEATHER_API_KEY → CI xcodebuild 命令行覆盖同名 build setting →
        # INFOPLIST_KEY 引用展开进生成的 Info.plist → WeatherConfiguration.current()；
        # CI 打包前另有「为空才注入产物 plist」的兜底与非空强校验（见 build.yml）。
        # 仓库内默认空串（本地未配置即未配置）；绝不把 Key 写进仓库。
        XZG_WEATHER_API_KEY: ""
        INFOPLIST_KEY_XZGWeatherAPIKey: "$(XZG_WEATHER_API_KEY)"
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.xiaozhanggui.ios
            CFBundleURLSchemes:
              - xzg
    dependencies:
      - target: XiaoZhangGuiWidget
        embed: true
        codeSign: true
        removeHeaders: true
        copy:
          destination: plugins
      - package: LLMProviderKit
        product: LLMProviderKit
      - package: LLMProviderKit
        product: LLMProviderKitOpenAI
      - package: ThinkingOrbsKit
        product: ThinkingOrbsKit
  XiaoZhangGuiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: XiaoZhangGuiWidget
      - path: SharedKernel
      # V3.3 Widget 2.0 Interactive：AppIntent 在扩展内直接写同一个 App Group store。
      # 以下为「同一源文件、双 target 编译」复用（非复制第二套逻辑/数据库）：
      # 7 个 @Model 与 App 完全相同的 SwiftData schema；容器/快照/通知/LA 全部用 App 原文件。
      - path: XiaoZhangGui/Models
      - path: XiaoZhangGui/DesignSystem/V21Color.swift
      - path: XiaoZhangGui/Data/ModelContainer.swift
      - path: XiaoZhangGui/Utilities/DateExt.swift
      - path: XiaoZhangGui/Utilities/AppSettings.swift
      - path: XiaoZhangGui/Services/SnapshotBuilder.swift
      - path: XiaoZhangGui/Services/NotificationManager.swift
      - path: XiaoZhangGui/Services/LiveActivityManager.swift
      - path: XiaoZhangGui/Services/WidgetTodoCompletion.swift
      # V3.8 PR-D：LiveActivityManager 改用 AppLog 记日志，AppLog 需随之双 target 编译（同上复用模式）。
      - path: XiaoZhangGui/Utilities/AppLog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios.widget
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "43"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: XiaoZhangGuiWidget/XiaoZhangGuiWidgetExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XiaoZhangGuiWidget/Info.plist
  XiaoZhangGuiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "UITests/**"
          - "**/*.ps1"
          - "**/*.json"
          - "**/*.md"
    dependencies:
      - target: XiaoZhangGui
      # 测试 bundle 通过宿主的 XiaoZhangGui.debug.dylib 访问 Provider 类型。
      # 不在此重复链接 package product；否则同一份 Provider 符号会同时来自
      # 宿主 dylib 与测试 bundle 内嵌 Frameworks，阻断 XCTest 注入。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XiaoZhangGui.app/XiaoZhangGui"
        BUNDLE_LOADER: "$(TEST_HOST)"
  XiaoZhangGuiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: XiaoZhangGui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhanggui.ios.uitests
        TEST_TARGET_NAME: XiaoZhangGui
        GENERATE_INFOPLIST_FILE: YES
