# XZG iOS V3.8 isolated validation (PoC-only branch; M0 recovery BLOCKED)
# Runs ONLY on GitHub Actions macOS/Xcode runner. Muse has no local Xcode.
# Reviewed from Tools/ios-v38-validate.yml.example (2026-10-16 handoff package).
# No Release, no signed/unsigned IPA publishing, no secrets required.
name: XZG iOS V3.8 isolated validation

on:
  push:
    branches:
      - 'ios/v3.8-*'
      - 'ios/v38-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xzg-ios-v38-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Same label family as the proven V3.7.1 workflow (Xcode 27.0 verified 2026-10-10).
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print commit and Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git branch --show-current
          uname -a
          xcodebuild -version
          xcrun simctl list devices available | head -30
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui
      - name: Select an available simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          NAME=""
          for cand in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then NAME="$cand"; break; fi
          done
          if [ -z "$NAME" ]; then
            echo 'No configured iPhone simulator found' >&2
            exit 3
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Simulator Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild build -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/xzg-ios-v38-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            >artifacts/build.log 2>&1 || { tail -n 120 artifacts/build.log; exit 1; }
      - name: XCTest and UITest
        shell: bash
        run: |
          set -euo pipefail
          # QUARANTINE (2026-10-16, user-approved): exactly ONE pre-existing test is
          # skipped here — XiaoZhangGuiUISmokeTests/testGoodsDeleteCancellationKeepsTarget.
          # It fails on the untouched d238ff0 baseline under Xcode 27 (test was written
          # against iOS 26.5 confirmationDialog-as-sheet behavior). It still runs every
          # round in the separate `quarantine` job below. Do NOT extend this skip list
          # without a new user decision; any other new failure fails this job (no
          # continue-on-error anywhere in this job).
          xcodebuild test -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/xzg-ios-v38-derived" \
            -resultBundlePath "$RUNNER_TEMP/xzg-ios-v38-test.xcresult" \
            -skip-testing:XiaoZhangGuiUITests/XiaoZhangGuiUISmokeTests/testGoodsDeleteCancellationKeepsTarget \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            >artifacts/test.log 2>&1 || { tail -n 160 artifacts/test.log; exit 1; }
      # E·QA: record the MotionLab demo while UI tests drive REAL expand/collapse
      # transitions. A still-frame recording is NOT a pass (verified in the next step).
      - name: Record V38 motion demo video (UI test + simctl recordVideo)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # xcodebuild shuts the simulator down after the test step; boot it
          # explicitly first (recordVideo needs a booted device).
          SIM_UDID=$(xcrun simctl list devices | grep -F "${{ steps.sim.outputs.name }} (" | head -n 1 | grep -oE '[0-9A-Fa-f-]{36}' | head -n 1)
          if [ -z "$SIM_UDID" ]; then echo "simulator '${{ steps.sim.outputs.name }}' not found"; exit 3; fi
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          # Wait for FULL boot readiness: the first app launch right after the
          # "(Booted)" flag appears can fail with "No such process"
          # (run 38824029239 flaked exactly this way on the first motion test).
          xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null 2>&1 || true
          sleep 15
          echo "== starting simctl screen recording =="
          # CRITICAL: record the EXPLICIT UDID we booted, not "booted".
          # xcodebuild "-destination name=..." can resolve to a DIFFERENT
          # device UDID than the first grep match above; recording "booted"
          # then captures the wrong (home-screen) device while tests pass on
          # another (run 38836192317: 5/5 tests green, video all home screen).
          xcrun simctl io "$SIM_UDID" recordVideo --force artifacts/v38-motionlab-demo.mp4 &
          RECORDER=$!
          sleep 2
          set +e
          xcodebuild test -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/xzg-ios-v38-derived" \
            -resultBundlePath "$RUNNER_TEMP/xzg-ios-v38-motion.xcresult" \
            -only-testing:XiaoZhangGuiUITests/V38MotionLabUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            >artifacts/motion-test.log 2>&1
          TEST_EXIT=$?
          set -e
          echo "== stopping screen recording (test exit=$TEST_EXIT) =="
          kill -INT "$RECORDER" 2>/dev/null || true
          wait "$RECORDER" 2>/dev/null || true
          for i in $(seq 1 30); do
            [ -s artifacts/v38-motionlab-demo.mp4 ] && break
            sleep 1
          done
          ls -la artifacts/v38-motionlab-demo.mp4
          tail -n 40 artifacts/motion-test.log
          exit $TEST_EXIT
      # E·QA: extract 1-fps frames and require several distinct frames,
      # so a frozen/still recording fails the gate instead of passing silently.
      # ALSO requires the recording-run's motion-test.log to show all 5 motion
      # tests passed: a "distinct frames" check alone can be fooled by a home
      # screen with a changing clock (run 38836192317).
      - name: Verify motion video is not a still frame
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VID=artifacts/v38-motionlab-demo.mp4
          if [ ! -s "$VID" ]; then echo "motion video missing: $VID"; exit 1; fi
          PASSED=$(grep -a -c "Test Case '-\[XiaoZhangGuiUITests.V38MotionLabUITests .*' passed" artifacts/motion-test.log || true)
          echo "motion tests passed in recording run: $PASSED/5"
          if [ "$PASSED" -lt 5 ]; then
            echo "NOT-TEST-DRIVEN FAIL: only $PASSED/5 motion tests passed during recording"
            exit 1
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          FRAMEDIR="$RUNNER_TEMP/v38-motion-frames"
          rm -rf "$FRAMEDIR"; mkdir -p "$FRAMEDIR"
          ffmpeg -hide_banner -loglevel error -i "$VID" -vf fps=1 "$FRAMEDIR/f%04d.png"
          COUNT=$(ls "$FRAMEDIR" | wc -l | tr -d ' ')
          DISTINCT=$(md5 -r "$FRAMEDIR"/*.png | awk '{print $1}' | sort -u | wc -l | tr -d ' ')
          echo "frames=$COUNT distinct=$DISTINCT"
          if [ "$DISTINCT" -lt 4 ]; then
            echo "STILL-FRAME FAIL: motion video shows no real animation ($DISTINCT distinct frames)"
            exit 1
          fi
          echo "motion video OK: $DISTINCT distinct frames out of $COUNT, 5/5 tests drove it"
      # E·QA: Light/Dark screenshots of the isolated MotionLab demo.
      # Launched directly via simctl with launch args (dashless aliases defined
      # in V38MotionLabQA.swift); the app renders V38MotionLabView as its root.
      - name: Capture V38 MotionLab screenshots (light/dark)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUNDLE=com.xiaozhanggui.ios
          # xcodebuild shuts the simulator down after the test steps; boot it explicitly.
          SIM_UDID=$(xcrun simctl list devices | grep -F "${{ steps.sim.outputs.name }} (" | head -n 1 | grep -oE '[0-9A-Fa-f-]{36}' | head -n 1)
          if [ -z "$SIM_UDID" ]; then echo "simulator '${{ steps.sim.outputs.name }}' not found"; exit 3; fi
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          # Same full-readiness wait as the recording step.
          xcrun simctl bootstatus "$SIM_UDID" -b >/dev/null 2>&1 || true
          sleep 15
          for SCHEME in light dark; do
            # Use the explicit UDID (not "booted") so launch/screenshot
            # always target the device we booted above.
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$SIM_UDID" "$BUNDLE" ui-testing v38-motion-lab v38-color-scheme "$SCHEME"
            sleep 6
            xcrun simctl io "$SIM_UDID" screenshot "artifacts/v38-motionlab-$SCHEME.png"
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE" 2>/dev/null || true
          done
          ls -la artifacts/v38-motionlab-*.png
      - name: Save test result bundles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/xzg-ios-v38-test.xcresult" ]; then
            (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/artifacts/V38-Test.xcresult.zip" xzg-ios-v38-test.xcresult)
          fi
          if [ -d "$RUNNER_TEMP/xzg-ios-v38-motion.xcresult" ]; then
            (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/artifacts/V38-Motion-Test.xcresult.zip" xzg-ios-v38-motion.xcresult)
          fi
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xzg-ios-v38-ci-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  quarantine:
    # Quarantined pre-existing failure, tracked separately (user-approved 2026-10-16).
    # Runs the quarantined test EVERY round, saves its own xcresult/log/screenshots.
    # This job NEVER blocks `validate` (no `needs:` link) and NEVER gates merges;
    # its failure is reported as "Quarantine known failure", never as main-CI PASS.
    # When the test passes consecutively per the exit criterion, the quarantine is
    # removed and the test returns to the main gate.
    name: Quarantined test (known baseline failure)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print commit and Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git branch --show-current
          xcodebuild -version
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui
      - name: Select an available simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          NAME=""
          for cand in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then NAME="$cand"; break; fi
          done
          if [ -z "$NAME" ]; then
            echo 'No configured iPhone simulator found' >&2
            exit 3
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Run quarantined test only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild test -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/xzg-ios-v38-quarantine" \
            -resultBundlePath "$RUNNER_TEMP/xzg-ios-v38-quarantine.xcresult" \
            -only-testing:XiaoZhangGuiUITests/XiaoZhangGuiUISmokeTests/testGoodsDeleteCancellationKeepsTarget \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            >artifacts/quarantine-test.log 2>&1 || { tail -n 160 artifacts/quarantine-test.log; exit 1; }
      - name: Save quarantine result bundle
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/xzg-ios-v38-quarantine.xcresult" ]; then
            (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/artifacts/V38-Quarantine-Test.xcresult.zip" xzg-ios-v38-quarantine.xcresult)
          fi
      - name: Upload quarantine artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xzg-ios-v38-quarantine-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
# IMPORTANT: No signed IPA, no unsigned IPA, no GitHub Release in this isolated validation workflow.
