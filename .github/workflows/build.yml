name: 小掌柜 3.0 构建

on:
  push:
    branches: [ios-dev, main]
  workflow_dispatch:

permissions:
  contents: write  # b28 T29: gh release create/upload 需要 contents: write

concurrency:
  group: xzg-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 小掌柜 Xcode 构建、测试与 IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 检查 Xcode 版本
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: 安装并生成 Xcode 工程
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d XiaoZhangGui.xcodeproj

      - name: 显示工程信息
        run: xcodebuild -list -project XiaoZhangGui.xcodeproj

      - name: Resolve Swift Packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui || true

      - name: 选择 iPhone 模拟器
        id: sim
        run: |
          set -euo pipefail
          NAME=""
          for cand in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then
              NAME="$cand"
              break
            fi
          done
          if [ -z "$NAME" ]; then
            NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [^()]*\) (.*$/\1/p' | sed 's/[[:space:]]*$//' | tail -n 1)
          fi
          test -n "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "使用模拟器: $NAME"

      - name: Simulator compile
        run: |
          set -euo pipefail
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: XCTest
        run: |
          set -euo pipefail
          xcodebuild test \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: iPhone 17 Air 窄屏编译校验（无该设备时回退 iPhone 17）
        id: aircheck
        run: |
          set -euo pipefail
          # v3.2 AC-9：为 iPhone 17 Air 窄屏旗舰做一次模拟器编译校验。
          # 当前 xcode-27 runner 镜像设备列表为 iPhone 17 / 17 Pro / 17 Pro Max / 17e，
          # 暂无 iPhone 17 Air；选最接近的窄屏旗舰 iPhone 17（6.1"）作为替代目标并记录。
          AIR_NAME=""
          for cand in "iPhone 17 Air" "iPhone 17"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then
              AIR_NAME="$cand"
              break
            fi
          done
          test -n "$AIR_NAME"
          echo "name=$AIR_NAME" >> "$GITHUB_OUTPUT"
          echo "窄屏校验模拟器: $AIR_NAME"
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=$AIR_NAME" \
            -derivedDataPath build/SimulatorAir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Device generic unsigned build + IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          app=$(find build/Device/Build/Products/Release-iphoneos -name '*.app' -type d -maxdepth 1 | head -n 1)
          echo "built app: ${app:-<empty>}"
          test -n "${app:-}"
          test -d "$app"
          test -f "$app/Info.plist"

          # 版本信息以构建产物 Info.plist 为准，文件名带构建号与 commit，防止装错旧包
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          CURRENT_PROJECT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          test -n "$MARKETING_VERSION"
          test -n "$CURRENT_PROJECT_VERSION"
          IPA="XiaoZhangGui-${MARKETING_VERSION}-b${CURRENT_PROJECT_VERSION}-${SHORT_SHA}.ipa"

          rm -rf ipa ipa-check
          mkdir -p ipa/Payload
          cp -R "$app" "ipa/Payload/你的小掌柜.app"

          (
            cd ipa
            zip -qry "../$IPA" Payload
          )

          test -f "$IPA"
          test -s "$IPA"
          unzip -t "$IPA"
          mkdir ipa-check
          unzip -q "$IPA" -d ipa-check
          test -d ipa-check/Payload

          shopt -s nullglob
          apps=(ipa-check/Payload/*.app)
          echo "Payload apps: ${apps[*]:-<none>}"
          test "${#apps[@]}" -eq 1
          APP="${apps[0]}"
          test "$(basename "$APP")" = "你的小掌柜.app"
          test -f "$APP/Info.plist"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "CFBundleExecutable=$EXEC"
          test -n "$EXEC"
          test -f "$APP/$EXEC"
          test -x "$APP/$EXEC" || test -f "$APP/$EXEC"
          ls -lh "$IPA"
          unzip -l "$IPA" | head -n 40
          echo "IPA validation PASS"

          echo "Version: $MARKETING_VERSION"
          echo "Build: $CURRENT_PROJECT_VERSION"
          echo "Commit: $SHORT_SHA"
          echo "IPA filename: $IPA"

          echo "XZG_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "XZG_BUILD=$CURRENT_PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "XZG_COMMIT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "IPA_FILENAME=$IPA" >> "$GITHUB_ENV"

      - name: 上传版本化 IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhangGui-${{ env.XZG_VERSION }}-b${{ env.XZG_BUILD }}-${{ env.XZG_COMMIT }}-IPA
          path: ${{ env.IPA_FILENAME }}
          if-no-files-found: error
          retention-days: 14

      # b28 T29: 在 GitHub Release 直接提供原始 .ipa，让 iPhone 上可直接下载，
      # 无需用户在 Actions Artifact 下载 .zip 后再解压
      - name: 创建 GitHub Release 并上传 IPA
        if: github.ref == 'refs/heads/redesign/v3.2.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${XZG_VERSION}-b${XZG_BUILD}-${XZG_COMMIT}"
          RELEASE_TITLE="你的小掌柜 v${XZG_VERSION} Build ${XZG_BUILD} (${XZG_COMMIT})"
          RELEASE_NOTES="## Phase 0 修复 + Theme + Wallpaper（b28）

          ### Phase 0
          - P0-1 XLSX 真机导入修复（SaobeiXLSXParser 重写）— 等待真实扫呗文件真机复验
          - P0-2 配送 Row V32SwipeRow 左右滑动 + 完成态持久化 + success haptic
          - P0-3 Performance 增加 meituan 收入来源 + 来源拆分
          - P0-4 接入 WeatherAPI.com 真实天气 + CoreLocation 定位 fallback 恩平
          - P0-5 删除首页头像入口 + 「我的」大头像身份卡弱化为店铺信息 Row

          ### Theme + Wallpaper（T23–T29）
          - T23 Build 28 基建：CURRENT_PROJECT_VERSION=28 + ThemeStore 骨架
          - T24 V32 token 全面主题化（14 个可主题化 token 接入 ThemeStore）
          - T25 我的 → 个性化：主题色 + 背景风格 选择器
          - T26 旧 app_theme_name 迁移单测（12 用例）
          - T27 自定义 Wallpaper：PhotosPicker + 降采样 + 落盘 + 遮罩 + 预渲染模糊
          - T28 性能：V32WallpaperBackground 内存缓存 UIImage 避免重复解码
          - T29 GitHub Release 直接提供 .ipa（无需用户解压 ZIP）

          ### IPA 验证
          - 文件名：${IPA_FILENAME}
          - 大小：$(ls -lh "$IPA_FILENAME" | awk '{print $5}')
          - 合法 ZIP 容器 + Payload/你的小掌柜.app
          - CFBundleShortVersionString=${XZG_VERSION}
          - CFBundleVersion=${XZG_BUILD}

          > Pre-release · 仅用于测试 · 不覆盖 stable release"

          # 若同名 tag 已存在（重跑 CI 时常见），先删除旧 Release 与 tag
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，先删除旧版本"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          fi

          gh release create "$RELEASE_TAG" \
            --target redesign/v3.2.0 \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease

          gh release upload "$RELEASE_TAG" "$IPA_FILENAME" --clobber

          echo "=== GitHub Release 创建完成 ==="
          echo "Release Tag: $RELEASE_TAG"
          echo "Release Title: $RELEASE_TITLE"
          echo "Asset: $IPA_FILENAME"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
