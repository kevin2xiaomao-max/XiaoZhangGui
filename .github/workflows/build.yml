name: 小掌柜 3.5 构建

on:
  push:
    # main / ios-dev 保持不变；3.5 封版分支自动跑完整 CI。
    # Release 步骤仍有分支条件，不会在其它分支发版。
    branches: [ios-dev, main, feature/v3.5-liquid-glass-leap, feature/v3.4-intelligence-experience, fix/v3.4-build34-real-data-repair]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xzg-ios-${{ github.ref }}
  cancel-in-progress: true
