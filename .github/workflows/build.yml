name: 小掌柜 3.0 构建

on:
  push:
    # P2-2：redesign/v3.2.0 push 自动触发完整 CI（此前仅 workflow_dispatch）。
    # main / ios-dev 触发保持不变；Release 步骤仍另有分支条件，不会因此在其它分支发版。
    branches: [ios-dev, main, redesign/v3.2.0]
  workflow_dispatch:

permissions:
  contents: write  # b28 T29: gh release create/upload 需要 contents: write

concurrency:
  group: xzg-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 小掌柜 Xcode 构建、测试与 IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: V3.3 AI 写隔离检查（AI 层禁止 import SwiftData）
        run: |
          set -euo pipefail
          AI_DIR="XiaoZhangGui/Features/Assistant/AI"
          if [ -d "$AI_DIR" ]; then
            if grep -RnE '^[[:space:]]*import[[:space:]]+SwiftData' "$AI_DIR"; then
              echo "FAIL: AI 层禁止 import SwiftData——Provider/Agent 只能产出 ToolCall，写库唯一入口是 ToolRouter → Repository"
              exit 1
            fi
            echo "AI write-isolation guard PASS"
          fi

      - name: 检查 Xcode 版本
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: 安装并生成 Xcode 工程
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d XiaoZhangGui.xcodeproj

      - name: 显示工程信息
        run: xcodebuild -list -project XiaoZhangGui.xcodeproj

      - name: Resolve Swift Packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project XiaoZhangGui.xcodeproj -scheme XiaoZhangGui || true

      - name: 选择 iPhone 模拟器
        id: sim
        run: |
          set -euo pipefail
          NAME=""
          for cand in "iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then
              NAME="$cand"
              break
            fi
          done
          if [ -z "$NAME" ]; then
            NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone [^()]*\) (.*$/\1/p' | sed 's/[[:space:]]*$//' | tail -n 1)
          fi
          test -n "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "使用模拟器: $NAME"

      - name: 重置并预热模拟器（规避 CoreDevice lockdown / 首帧渲染停滞）
        run: |
          set -euo pipefail
          NAME="${{ steps.sim.outputs.name }}"
          # 干净数据区：规避持久 runner 上 CoreDevice / 渲染守护进程脏状态导致首帧失败
          xcrun simctl shutdown all || true
          xcrun simctl erase "$NAME" || true
          xcrun simctl boot "$NAME" || true
          # -b 阻塞直到模拟器真正启动完成（dataContainer 就绪），超时 180s
          xcrun simctl bootstatus "$NAME" -b -t 180 || true
          open -a Simulator || true
          xcrun simctl list devices booted

      - name: Simulator compile
        run: |
          set -euo pipefail
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/Simulator \
            XZG_WEATHER_API_KEY="${{ secrets.XZG_WEATHER_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: XCTest
        timeout-minutes: 40
        run: |
          set -uo pipefail
          NAME="${{ steps.sim.outputs.name }}"
          # 期望用例总数直接从源码统计，新增 / 删除测试自动跟随，不写死数字。
          EXPECTED=$(grep -rEho 'func[[:space:]]+test[A-Za-z0-9_]+' Tests --include='*.swift' | wc -l | tr -d '[:space:]')
          echo "期望测试用例数: $EXPECTED"
          test "$EXPECTED" -gt 0
          LOG="$RUNNER_TEMP/xctest.log"

          reset_sim() {
            xcrun simctl shutdown all || true
            xcrun simctl erase "$NAME" || true
            xcrun simctl boot "$NAME" || true
            xcrun simctl bootstatus "$NAME" -b -t 180 || true
            open -a Simulator || true
          }

          # 判定：全部 EXPECTED 个用例执行且 0 失败才判过。
          # xcode-27 RC 降级宿主偶发在测试全部通过后收集 diagnostics 卡 600s
          # 并以 exit 65 结束（零断言失败）；此时以 XCTest 权威汇总为准。
          # 任何真实断言失败（>0 failures）一律不判过，重试也不会被掩盖。
          log_passes_all() {
            grep -Eq '[1-9][0-9]* failures? \(' "$1" && return 1
            grep -Eq 'with [1-9][0-9]* failures' "$1" && return 1
            grep -Eq "Executed $EXPECTED tests, with 0 failures" "$1"
          }

          # 不用 -retry-tests-on-failure：它在降级宿主上会产生宿主重启级联，
          # 把崩溃前已通过的用例误记为失败。改为整轮重跑：每次全新模拟器，
          # 健康宿主上 200+ 用例仅需数秒。
          for attempt in 1 2 3; do
            echo "=== XCTest attempt $attempt/3 ==="
            reset_sim
            xcodebuild test \
              -project XiaoZhangGui.xcodeproj \
              -scheme XiaoZhangGui \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath build/Simulator \
              XZG_WEATHER_API_KEY="${{ secrets.XZG_WEATHER_API_KEY }}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$LOG"
            code=${PIPESTATUS[0]}
            if log_passes_all "$LOG"; then
              echo "XCTest PASS（attempt $attempt，$EXPECTED tests / 0 failures）"
              exit 0
            fi
            echo "attempt $attempt 未全绿（xcodebuild exit=$code），重置模拟器后重试"
            sleep 5
          done

          echo "FAIL: 3 次尝试后 XCTest 仍未全绿"
          tail -n 150 "$LOG" || true
          exit 1

      - name: iPhone Air 窄屏编译校验（无该设备时回退最接近的 iPhone 旗舰）
        id: aircheck
        run: |
          set -euo pipefail
          # v3.2 AC-9：为 iPhone Air 窄屏旗舰做一次模拟器编译校验（P2：官方名称为 iPhone Air）。
          # 设备必须按 xcode-27 runner 当前真实设备列表选择：有 iPhone Air 用 iPhone Air，
          # 否则回退最接近的窄屏旗舰（当前镜像为 iPhone 17），并继续兜底任意可用 iPhone。
          AIR_NAME=""
          for cand in "iPhone Air" "iPhone 17"; do
            if xcrun simctl list devices available | grep -F "$cand (" >/dev/null; then
              AIR_NAME="$cand"
              break
            fi
          done
          test -n "$AIR_NAME"
          echo "name=$AIR_NAME" >> "$GITHUB_OUTPUT"
          echo "窄屏校验模拟器: $AIR_NAME"
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination "platform=iOS Simulator,name=$AIR_NAME" \
            -derivedDataPath build/SimulatorAir \
            XZG_WEATHER_API_KEY="${{ secrets.XZG_WEATHER_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Device generic unsigned build + IPA
        shell: bash
        run: |
          set -euo pipefail
          # P0-1：Secret 只在本 step shell 内可见，日志自动掩码，绝不写入仓库或回显原文
          export XZG_WEATHER_API_KEY="${{ secrets.XZG_WEATHER_API_KEY }}"
          test -n "$XZG_WEATHER_API_KEY"
          xcodebuild build \
            -project XiaoZhangGui.xcodeproj \
            -scheme XiaoZhangGui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/Device \
            XZG_WEATHER_API_KEY="$XZG_WEATHER_API_KEY" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          app=$(find build/Device/Build/Products/Release-iphoneos -name '*.app' -type d -maxdepth 1 | head -n 1)
          echo "built app: ${app:-<empty>}"
          test -n "${app:-}"
          test -d "$app"
          test -f "$app/Info.plist"

          # P0-1 天气注入链（产物侧）：
          # 优先使用构建期 INFOPLIST_KEY 展开生成的键；若该 Xcode 生成器未把命令行覆盖
          # 展开进最终 plist（不同 Xcode 行为差异），则在打包前显式写入产物 Info.plist。
          # 无签名构建，打包前改 plist 不影响签名；全程不回显 Key 原文。
          current_key="$(/usr/libexec/PlistBuddy -c 'Print :XZGWeatherAPIKey' "$app/Info.plist" 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$current_key" ]; then
            /usr/libexec/PlistBuddy -c "Add :XZGWeatherAPIKey string $XZG_WEATHER_API_KEY" "$app/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :XZGWeatherAPIKey $XZG_WEATHER_API_KEY" "$app/Info.plist"
            echo "Weather: key injected into product Info.plist pre-package (value hidden)"
          else
            echo "Weather: key expanded at build time (value hidden)"
          fi

          # 强校验：最终 .app/Info.plist 中 XZGWeatherAPIKey 必须存在且非空（只输出长度）
          WEATHER_KEY_LEN="$(/usr/libexec/PlistBuddy -c 'Print :XZGWeatherAPIKey' "$app/Info.plist" 2>/dev/null | tr -d '[:space:]' | wc -c | tr -d '[:space:]')"
          if [ -z "$WEATHER_KEY_LEN" ] || [ "$WEATHER_KEY_LEN" -eq 0 ]; then
            echo "FAIL: XZGWeatherAPIKey 缺失或为空——请检查 GitHub Secret XZG_WEATHER_API_KEY 与注入链"
            exit 1
          fi
          echo "Weather: XZGWeatherAPIKey configured, length=${WEATHER_KEY_LEN}, value hidden"

          # 版本信息以构建产物 Info.plist 为准，文件名带构建号与 commit，防止装错旧包
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          CURRENT_PROJECT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          test -n "$MARKETING_VERSION"
          test -n "$CURRENT_PROJECT_VERSION"
          IPA="XiaoZhangGui-${MARKETING_VERSION}-b${CURRENT_PROJECT_VERSION}-${SHORT_SHA}.ipa"

          rm -rf ipa ipa-check
          mkdir -p ipa/Payload
          cp -R "$app" "ipa/Payload/你的小掌柜.app"

          (
            cd ipa
            zip -qry "../$IPA" Payload
          )

          test -f "$IPA"
          test -s "$IPA"
          unzip -t "$IPA"
          mkdir ipa-check
          unzip -q "$IPA" -d ipa-check
          test -d ipa-check/Payload

          shopt -s nullglob
          apps=(ipa-check/Payload/*.app)
          echo "Payload apps: ${apps[*]:-<none>}"
          test "${#apps[@]}" -eq 1
          APP="${apps[0]}"
          test "$(basename "$APP")" = "你的小掌柜.app"
          test -f "$APP/Info.plist"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "CFBundleExecutable=$EXEC"
          test -n "$EXEC"
          test -f "$APP/$EXEC"
          test -x "$APP/$EXEC" || test -f "$APP/$EXEC"
          ls -lh "$IPA"
          unzip -l "$IPA" | head -n 40
          echo "IPA validation PASS"

          echo "Version: $MARKETING_VERSION"
          echo "Build: $CURRENT_PROJECT_VERSION"
          echo "Commit: $SHORT_SHA"
          echo "IPA filename: $IPA"

          echo "XZG_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "XZG_BUILD=$CURRENT_PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "XZG_COMMIT=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "IPA_FILENAME=$IPA" >> "$GITHUB_ENV"

      - name: 上传版本化 IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhangGui-${{ env.XZG_VERSION }}-b${{ env.XZG_BUILD }}-${{ env.XZG_COMMIT }}-IPA
          path: ${{ env.IPA_FILENAME }}
          if-no-files-found: error
          retention-days: 14

      # b28 T29: 在 GitHub Release 直接提供原始 .ipa，让 iPhone 上可直接下载，
      # 无需用户在 Actions Artifact 下载 .zip 后再解压
      - name: 创建 GitHub Release 并上传 IPA
        if: github.ref == 'refs/heads/redesign/v3.2.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${XZG_VERSION}-b${XZG_BUILD}-${XZG_COMMIT}"
          RELEASE_TITLE="你的小掌柜 v${XZG_VERSION} Build ${XZG_BUILD} (${XZG_COMMIT})"
          RELEASE_NOTES="## B28 真机验收修复批次（Build ${XZG_BUILD}）

          ### P0
          - P0-1 天气：GitHub Secret → build setting → Info.plist 注入链，Release 真机不再显示未配置；状态区分 未配置/定位未授权/网络失败/API 请求失败/使用缓存
          - P0-2 待办：tab 切换胶囊始终可见，记录/今天/已完成/逾期 无死路切换
          - P0-3 壁纸：壁纸下沉为每页可见背景层，首页/日程/待办/我的真实显示；清除后立即恢复主题背景
          - P0-4 配送图片：列表行内缩略图 + externalStorage round-trip 单测（增/换/删）

          ### P1 / P2
          - P1-1 「我的」顶部绿色 Hero 改为普通主题卡片 Row（首页营业额 Hero 不变）
          - P1-2 配送卡底部只表达配送时间（未设配送时间），不再与状态 Pill 冲突
          - P1-3 全天事项统一时间语义（DayTimeLabel），任何页面不再出现 00:00
          - P1-4 清理旧 AppTheme/appThemeName 残留，主题统一 ThemeStore + V32 tokens
          - P2 工程文案统一为 iPhone Air（CI 设备按真实设备列表选择）

          ### IPA 验证
          - 文件名：${IPA_FILENAME}
          - 大小：$(ls -lh "$IPA_FILENAME" | awk '{print $5}')
          - 合法 ZIP 容器 + Payload/你的小掌柜.app
          - CFBundleShortVersionString=${XZG_VERSION}
          - CFBundleVersion=${XZG_BUILD}
          - XZGWeatherAPIKey：已注入（值不展示）

          > Pre-release · 仅用于测试 · 不覆盖 stable release"

          # 若同名 tag 已存在（重跑 CI 时常见），先删除旧 Release 与 tag
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，先删除旧版本"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          fi

          gh release create "$RELEASE_TAG" \
            --target redesign/v3.2.0 \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease

          gh release upload "$RELEASE_TAG" "$IPA_FILENAME" --clobber

          echo "=== GitHub Release 创建完成 ==="
          echo "Release Tag: $RELEASE_TAG"
          echo "Release Title: $RELEASE_TITLE"
          echo "Asset: $IPA_FILENAME"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
