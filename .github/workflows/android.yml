name: 小掌柜 Android V3.7.1 构建

on:
  push:
    branches: [android/v3.6, android/v3.7.1-oppo-port, android/v3.8-sleepdown-coloros]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xzg-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android assembleDebug / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 校验 wrapper
        run: |
          set -euo pipefail
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: assembleDebug
        run: ./gradlew clean assembleDebug --stacktrace

      # 先录制 Paparazzi 黄金图，再跑单元测试：
      # Paparazzi 1.x 在 verify 模式下遇到缺失的黄金图会直接失败，
      # 若 test 先跑，record 步骤永远到不了，截图 artifact 也产不出。
      # record 之后 test 内的 Paparazzi 用例会对刚录制的图做 verify。
      - name: Paparazzi 截图（Visual Gate）
        run: ./gradlew recordPaparazziDebug --stacktrace

      - name: 单元测试
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: 上传 Paparazzi 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-screenshots
          path: android/app/src/test/snapshots/
          if-no-files-found: warn

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: warn

  e2e:
    name: E2E 模拟器测试（connectedDebugAndroidTest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    # 与 build job 并行：模拟器 E2E 跑全部 connectedAndroidTest
    #（Worker A 的 Compose UI 测试 + e2e 包旅程），与 test/ 单元测试互不重叠。
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器 E2E 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 / x86_64 / 无 GMS：贴合中国大陆与 OPPO 无 GMS 场景
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # 注意：emulator-runner 按行拆 shell 执行，cd/set 变量不保持；
          # 因此整个逻辑写成单行：跑测试→抓 logcat→按测试结果退出。
          script: ./android/gradlew -p android connectedDebugAndroidTest --stacktrace; STATUS=$?; adb logcat -d > "$GITHUB_WORKSPACE/e2e-logcat.txt" || true; exit $STATUS

      - name: 上传 E2E 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-e2e-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn

      - name: 上传 logcat（失败现场）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-e2e-logcat
          path: e2e-logcat.txt
          if-no-files-found: warn

  release:
    name: Release 构建（assembleRelease / bundleRelease）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    # 签名策略（稳定证书优先，随机测试证书回退）：
    # - 仓库 Secrets 中配置了 XZG_RELEASE_KEYSTORE → 解码为稳定证书，
    #   用于正式更新包（同一证书，保证后续版本可覆盖升级）；
    # - 未配置 Secrets（fork / PR / 外部贡献者）→ 回退为现场生成的
    #   随机测试 keystore，仅保证构建链路可跑，绝不用于正式发布。
    # 注意：密钥与密码一律经 GitHub Secrets 注入，绝不写进 workflow 文件。
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 准备 release 签名：
      # - 有稳定证书 Secrets（XZG_RELEASE_KEYSTORE 非空）→ base64 解码到
      #   $RUNNER_TEMP/xzg-release.jks，用 XZG_RELEASE_KEYSTORE_PASSWORD /
      #   XZG_KEY_ALIAS / XZG_KEY_PASSWORD 签名（正式更新包用）；
      # - 无 Secrets → 回退：现场生成随机测试 keystore（仅保构建链路可跑）。
      # 注意：JDK keytool 生成的 PKCS12 keystore 不支持 store/key 双密码
      #（会报 "Different store and key passwords not supported" 并忽略 -keypass），
      # 因此两路都只维护一个密码，store 与 key 共用。
      - name: 准备 release 签名（稳定证书 / 随机测试证书）
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.XZG_RELEASE_KEYSTORE }}" ]; then
            echo "::notice::使用仓库 Secrets 中的稳定 release 证书签名"
            echo "${{ secrets.XZG_RELEASE_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/xzg-release.jks"
            echo "ks_file=$RUNNER_TEMP/xzg-release.jks" >> "$GITHUB_OUTPUT"
            echo "ks_alias=${{ secrets.XZG_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "ks_pass=${{ secrets.XZG_RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${{ secrets.XZG_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "signing_mode=stable" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置稳定 release 证书 Secrets，回退为 CI 随机测试签名（仅用于无 secret 环境）"
            KS_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore /tmp/xzg-ci-test.jks \
              -storepass "$KS_PASS" -alias xzgtest \
              -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=XiaoZhangGui CI Test, OU=Test, O=XiaoZhangGui, C=CN" \
              -noprompt
            echo "ks_file=/tmp/xzg-ci-test.jks" >> "$GITHUB_OUTPUT"
            echo "ks_alias=xzgtest" >> "$GITHUB_OUTPUT"
            echo "ks_pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "signing_mode=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: assembleRelease + bundleRelease
        env:
          XZG_RELEASE_KEYSTORE_FILE: ${{ steps.keystore.outputs.ks_file }}
          XZG_RELEASE_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ks_pass }}
          XZG_RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.ks_alias }}
          XZG_RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_pass }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 验证 release 产物（badging / 签名证书）
        run: |
          set -euo pipefail
          echo "signing_mode=${{ steps.keystore.outputs.signing_mode }}"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          echo "AAPT=$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package:|^application:"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Verified using|certificate SHA-256"
          unzip -l app/build/outputs/bundle/release/app-release.aab | head -20

      - name: 上传 Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 上传 Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
