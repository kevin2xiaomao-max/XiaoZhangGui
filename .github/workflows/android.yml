name: 小掌柜 Android V3.6 构建

on:
  push:
    branches: [android/v3.6]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xzg-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android assembleDebug / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 校验 wrapper
        run: |
          set -euo pipefail
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: assembleDebug
        run: ./gradlew clean assembleDebug --stacktrace

      # 先录制 Paparazzi 黄金图，再跑单元测试：
      # Paparazzi 1.x 在 verify 模式下遇到缺失的黄金图会直接失败，
      # 若 test 先跑，record 步骤永远到不了，截图 artifact 也产不出。
      # record 之后 test 内的 Paparazzi 用例会对刚录制的图做 verify。
      - name: Paparazzi 截图（Visual Gate）
        run: ./gradlew recordPaparazziDebug --stacktrace

      - name: 单元测试
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: 上传 Paparazzi 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-screenshots
          path: android/app/src/test/snapshots/
          if-no-files-found: warn

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: warn

  e2e:
    name: E2E 模拟器测试（connectedDebugAndroidTest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    # 与 build job 并行：模拟器 E2E 跑全部 connectedAndroidTest
    #（Worker A 的 Compose UI 测试 + e2e 包旅程），与 test/ 单元测试互不重叠。
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模拟器 E2E 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 / x86_64 / 无 GMS：贴合中国大陆与 OPPO 无 GMS 场景
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # 注意：emulator-runner 按行拆 shell 执行，cd/set 变量不保持；
          # 因此整个逻辑写成单行：跑测试→抓 logcat→按测试结果退出。
          script: ./android/gradlew -p android connectedDebugAndroidTest --stacktrace; STATUS=$?; adb logcat -d > "$GITHUB_WORKSPACE/e2e-logcat.txt" || true; exit $STATUS

      - name: 上传 E2E 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-e2e-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn

      - name: 上传 logcat（失败现场）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-e2e-logcat
          path: e2e-logcat.txt
          if-no-files-found: warn

  release:
    name: Release 构建（assembleRelease / bundleRelease）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    # 与 build/e2e 并行：release 产物只做 CI 临时测试签名，
    # 绝不使用任何正式发布签名，keystore 现场生成、绝不提交。
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 生成 CI 临时测试签名 keystore
        id: testkey
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -keystore /tmp/xzg-ci-test.jks \
            -storepass "$STORE_PASS" -alias xzgtest -keypass "$KEY_PASS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=XiaoZhangGui CI Test, OU=Test, O=XiaoZhangGui, C=CN" \
            -noprompt
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: assembleRelease + bundleRelease
        env:
          XZG_RELEASE_KEYSTORE_FILE: /tmp/xzg-ci-test.jks
          XZG_RELEASE_KEYSTORE_PASSWORD: ${{ steps.testkey.outputs.store_pass }}
          XZG_RELEASE_KEY_ALIAS: xzgtest
          XZG_RELEASE_KEY_PASSWORD: ${{ steps.testkey.outputs.key_pass }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 验证 release 产物（badging）
        run: |
          set -euo pipefail
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          echo "AAPT=$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package:|^application:"
          unzip -l app/build/outputs/bundle/release/app-release.aab | head -20

      - name: 上传 Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 上传 Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhanggui-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
